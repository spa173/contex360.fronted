<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Solicita una Demo - Contex360</title>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Font Awesome -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<!-- Google Fonts: Inter -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind Configuration -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            primary: {
              50: '#f5f3ff',
              100: '#ede9fe',
              200: '#ddd6fe',
              300: '#c4b5fd',
              400: '#a78bfa',
              500: '#8b5cf6', // Brand color
              600: '#7c3aed',
              700: '#6d28d9',
              800: '#5b21b6',
              900: '#4c1d95',
              950: '#2e1065',
            },
            surface: {
              DEFAULT: '#faf8ff',
              dim: '#d2d9f4',
              container: '#f2f3ff',
            }
          },
          borderRadius: {
            'xl': '0.75rem', // ROUND_EIGHT
            '2xl': '1rem',
          }
        }
      }
    }
  </script>
<style data-purpose="base-styles">
    body {
      background-color: #faf8ff; /* surface */
      color: #1e1e24; /* on-surface */
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    /* Custom Scrollbar for form textareas */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background-color: #cbd5e1;
      border-radius: 20px;
    }
  </style>
</head>
<body class="font-sans antialiased text-gray-900 bg-surface">
<!-- BEGIN: Header -->
<header class="bg-white border-b border-gray-200 sticky top-0 z-10 w-full">
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
<!-- Brand -->
<div class="flex items-center gap-2">
<div class="w-8 h-8 bg-primary-600 rounded-lg flex items-center justify-center text-white font-bold text-lg">
          C
        </div>
<span class="text-xl font-bold tracking-tight text-gray-900">Contex360</span>
</div>
<!-- Navigation Link -->
<nav>
<a class="text-sm font-medium text-gray-600 hover:text-primary-600 flex items-center gap-2 transition-colors" href="#">
<i class="fa-solid fa-arrow-left"></i>
          Volver al inicio
        </a>
</nav>
</div>
</header>
<!-- END: Header -->
<!-- BEGIN: Main Content -->
<main class="flex-grow flex items-center justify-center px-4 py-12 sm:px-6 lg:px-8 bg-gray-50">
<!-- Form Card Container -->
<div class="max-w-3xl w-full bg-white rounded-2xl shadow-sm border border-gray-100 p-8 sm:p-12">
<!-- Card Header -->
<div class="text-center mb-10">
<h1 class="text-3xl font-bold text-gray-900 mb-3">Solicita una Demo</h1>
<p class="text-gray-500 text-sm sm:text-base">Empieza tu prueba gratuita de 30 días hoy mismo.</p>
</div>
<!-- Demo Form -->
<form action="#" class="space-y-6" method="POST">
<!-- Grid Layout for Fields -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<!-- Nombre Completo -->
<div data-purpose="form-field-nombre">
<label class="block text-sm font-semibold text-gray-700 mb-1" for="fullName">Nombre completo *</label>
<input class="block w-full rounded-xl border-gray-300 shadow-sm focus:border-primary-500 focus:ring-primary-500 sm:text-sm bg-gray-50 border px-4 py-2.5 transition-colors" id="fullName" name="fullName" placeholder="Ej. Juan Pérez" required="" type="text"/>
</div>
<!-- Empresa -->
<div data-purpose="form-field-empresa">
<label class="block text-sm font-semibold text-gray-700 mb-1" for="company">Empresa *</label>
<input class="block w-full rounded-xl border-gray-300 shadow-sm focus:border-primary-500 focus:ring-primary-500 sm:text-sm bg-gray-50 border px-4 py-2.5 transition-colors" id="company" name="company" placeholder="Nombre de tu empresa" required="" type="text"/>
</div>
<!-- Correo Electrónico -->
<div data-purpose="form-field-correo">
<label class="block text-sm font-semibold text-gray-700 mb-1" for="email">Correo electrónico *</label>
<input class="block w-full rounded-xl border-gray-300 shadow-sm focus:border-primary-500 focus:ring-primary-500 sm:text-sm bg-gray-50 border px-4 py-2.5 transition-colors" id="email" name="email" placeholder="tu@empresa.com" required="" type="email"/>
</div>
<!-- Teléfono -->
<div data-purpose="form-field-telefono">
<label class="block text-sm font-semibold text-gray-700 mb-1" for="phone">Teléfono</label>
<input class="block w-full rounded-xl border-gray-300 shadow-sm focus:border-primary-500 focus:ring-primary-500 sm:text-sm bg-gray-50 border px-4 py-2.5 transition-colors" id="phone" name="phone" placeholder="+57 300 123 4567" type="tel"/>
</div>
<!-- Ciudad -->
<div data-purpose="form-field-ciudad">
<label class="block text-sm font-semibold text-gray-700 mb-1" for="city">Ciudad</label>
<input class="block w-full rounded-xl border-gray-300 shadow-sm focus:border-primary-500 focus:ring-primary-500 sm:text-sm bg-gray-50 border px-4 py-2.5 transition-colors" id="city" name="city" placeholder="Ej. Bogotá" type="text"/>
</div>
<!-- Sector -->
<div data-purpose="form-field-sector">
<label class="block text-sm font-semibold text-gray-700 mb-1" for="sector">Sector</label>
<select class="block w-full rounded-xl border-gray-300 shadow-sm focus:border-primary-500 focus:ring-primary-500 sm:text-sm bg-gray-50 border px-4 py-2.5 text-gray-500 transition-colors" id="sector" name="sector">
<option disabled="" selected="" value="">Selecciona un sector</option>
<option value="tecnologia">Tecnología</option>
<option value="salud">Salud</option>
<option value="finanzas">Finanzas</option>
<option value="retail">Retail</option>
<option value="otro">Otro</option>
</select>
</div>
</div>
<!-- Mensaje / Necesidades -->
<div class="mt-6" data-purpose="form-field-mensaje">
<label class="block text-sm font-semibold text-gray-700 mb-1" for="message">Mensaje / Necesidades</label>
<textarea class="block w-full rounded-xl border-gray-300 shadow-sm focus:border-primary-500 focus:ring-primary-500 sm:text-sm bg-gray-50 border px-4 py-3 transition-colors resize-none" id="message" name="message" placeholder="Cuéntanos sobre los retos financieros de tu empresa..." rows="4"></textarea>
</div>
<!-- Submit Button -->
<div class="mt-8">
<button class="w-full flex justify-center py-3.5 px-4 border border-transparent rounded-xl shadow-sm text-sm font-bold text-white bg-primary-600 hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 transition-colors" type="submit">
            Solicitar Demo Gratis
          </button>
</div>
<!-- Privacy Policy Note -->
<div class="text-center mt-4">
<p class="text-xs text-gray-500">
            Al enviar aceptas nuestra <a class="text-primary-600 hover:underline" href="#">política de privacidad</a>.
          </p>
</div>
</form>
</div>
</main>
<!-- END: Main Content -->
<!-- BEGIN: Footer -->
<footer class="bg-white border-t border-gray-200 mt-auto">
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex flex-col sm:flex-row justify-between items-center gap-4">
<!-- Copyright -->
<div class="text-xs text-gray-500">
        © 2026 Contex360. Todos los derechos reservados.
      </div>
<!-- Footer Links -->
<div class="flex space-x-6 text-xs text-gray-500">
<a class="hover:text-primary-600 transition-colors" href="#">Términos y Condiciones</a>
<a class="hover:text-primary-600 transition-colors" href="#">Soporte</a>
<a class="hover:text-primary-600 transition-colors" href="#">Contacto</a>
</div>
</div>
</footer>
<!-- END: Footer -->
</body></html>
