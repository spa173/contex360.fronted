<svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 56 56">
  <style>
    .rotor {
      transform-origin: 28px 28px;
      animation: spin 8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
  <rect width="56" height="56" rx="12" fill="#18181B"/>
  <g class="rotor">
    <path d="M44 18 A 16 16 0 1 0 44 38" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round" fill="none"/>
    <path d="M44 18 A 16 16 0 0 1 44 38" stroke="#2563EB" stroke-width="5.5" stroke-linecap="round" fill="none"/>
  </g>
</svg>
