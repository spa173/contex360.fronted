name: Frontend CI

on:
  push:
    branches:
      - main
      - staging
      - 'codex/**'
  pull_request:
    branches:
      - main
      - staging

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Static Analysis (Type Checking)
        run: npx vue-tsc --noEmit

      - name: Linter (Reporting only)
        run: npm run lint || echo "Linter checks completed with warnings"

      - name: Build
        run: npm run build

      - name: Run Unit Tests
        run: npm test

